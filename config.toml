# rosita global config — a dogfooded port of ~/.claude/CLAUDE.md.
#
# Each section of the global CLAUDE.md becomes one reusable fragment; the
# `machine` profile composes them into the overlay rosita renders off-repo (or
# wherever you bind it). Edit these in `rosita studio` or here directly.

[[fragments]]
id = "comms-style"
description = "Communication style"
category = "Operating Style"
guidance = '''
Use plain, direct language.

Assume the user is technical, but do not assume they have all the current
context in their head. Explain important ideas clearly before using shorthand.

When reporting work:

- Start with the result.
- Explain what changed in plain language.
- Say why it matters.
- Use project labels like `D1`, `D2`, `scoped mode`, or `fallback` only after
  briefly defining them.
- Prefer short sentences over dense paragraphs.
- Avoid abstract phrases like "cost calculus," "correct-by-construction," "spine
  flipped," or "material finding" unless you immediately explain what they mean.
- Do not over-compress reasoning into jargon-heavy summaries.
- Use examples when a concept could be misunderstood.
- Separate facts, decisions, risks, and next steps.

Good style:

> I fixed the import resolver. It was failing to connect files like `foo.js` to
> the actual TypeScript file `foo.ts`. That meant the system could miss which
> files depend on each other. The fix should make dependency lookups more
> reliable.

Avoid this style:

> Resolver clobber fix completed; reverse-dependency graph repair landed and
> scoped-mode eligibility materially changes the cost calculus.

When asking the user to choose a direction, summarize each option in plain
language and include the tradeoff in one sentence.
'''

[[fragments]]
id = "guardrails"
description = "Safety guardrails"
category = "Operating Style"
guidance = '''
**Never:**

- Commit or push directly to `main`/`master` — always work on a branch.
- Print, log, or commit secrets, credentials, or `.env` files.
- Run destructive or hard-to-reverse actions (`rm -rf`, DB drops, bulk deletes,
  file overwrites) without confirmation.
- Suggest or execute a command that could end the user's session (login/seat
  manager restarts, killing the compositor, network resets over SSH, etc.)
  without double-checking the blast radius and being transparent about the risk.

**Ask first:**

- Before modifying files the user didn't mention.
- After two failed attempts at the same problem — don't keep retrying blindly.
- Before installing new dependencies, changing schemas, or restructuring directories.
'''

[[fragments]]
id = "conventional-commits"
description = "Conventional commits"
category = "Engineering Standards"
guidance = '''
Commit at logical checkpoints with clear messages — don't wait to be told.

Use Conventional Commits (`feat:`, `fix:`, `refactor:`, `docs:`, …). Imperative
subject ≤72 chars; the body explains *why* when it is non-obvious.
'''

# Environment discovery — recreated natively from rosita's built-in providers
# (no external `agent-env` script). Each section is a provider-backed fragment;
# providers always run trusted (no `rosita allow` needed) and probe live at render
# time. In studio's read-only preview they show the placeholder until a render
# populates the cache.

[[fragments]]
id = "environment"
description = "Environment ground truth"
category = "Local Environment"
guidance = '''
Environment is ground truth, not assumption. The sections that follow are probed
live from this machine at render time — treat them as authoritative for what is
actually installed, running, and reachable here. Consult them before assuming a
tool, version, service, or host exists, and prefer them over guessing. A missing
or empty section means the probe found nothing (tool absent, daemon down, or
logged out), so ask rather than guess. These are point-in-time facts about the
machine — don't bake them into committed code, config, or docs.
'''

# Each environment section is an owned bash script — the commands live here, not
# in a compiled provider. They run trusted (global layer), embedding their stdout
# at render time. Pure scripts (no guidance template) so studio opens them for
# view/edit; studio's read-only preview shows a "runs at render" placeholder card.

[[fragments]]
id = "host"
description = "Machine detection"
category = "Local Environment"
cache = "5m"
script_lang = "bash"
command = '''
detect_os() {
  case "$(uname -s 2>/dev/null || echo unknown)" in
    Darwin) echo "macOS" ;;
    Linux)  echo "Linux" ;;
    *)      uname -s 2>/dev/null || echo unknown ;;
  esac
}
distro_info() {
  if [ -r /etc/os-release ]; then
    . /etc/os-release
    printf '%s %s' "${NAME:-Linux}" "${VERSION_ID:-}"
  elif command -v sw_vers >/dev/null 2>&1; then
    printf 'macOS %s (build %s)' "$(sw_vers -productVersion 2>/dev/null)" "$(sw_vers -buildVersion 2>/dev/null)"
  else
    echo unknown
  fi
}
printf 'hostname:  %s\n' "$(hostname 2>/dev/null || echo unknown)"
printf 'user:      %s\n' "${USER:-$(id -un 2>/dev/null || echo unknown)}"
printf 'os:        %s\n' "$(detect_os)"
printf 'distro:    %s\n' "$(distro_info)"
printf 'arch:      %s\n' "$(uname -m 2>/dev/null || echo unknown)"
printf 'kernel:    %s\n' "$(uname -r 2>/dev/null || echo unknown)"
printf 'shell:     %s\n' "${SHELL:-unknown}"
if command -v uptime >/dev/null 2>&1; then
  up=$(uptime | sed -E 's/^[^,]*up //; s/,[[:space:]]+[0-9]+ users?.*$//; s/,[[:space:]]+load[[:space:]]+average.*$//')
  [ -n "$up" ] && printf 'uptime:    %s\n' "$up"
fi
'''

[[fragments]]
id = "tailnet"
description = "Tailnet discovery"
category = "Local Environment"
cache = "5m"
script_lang = "bash"
command = '''
ts=""
if command -v tailscale >/dev/null 2>&1; then
  ts=$(command -v tailscale)
else
  for p in \
    /Applications/Tailscale.app/Contents/MacOS/Tailscale \
    /opt/homebrew/bin/tailscale \
    /usr/local/bin/tailscale; do
    [ -x "$p" ] && { ts="$p"; break; }
  done
fi
[ -n "$ts" ] || exit 0
status=$("$ts" status 2>/dev/null) || true
if [ -n "$status" ]; then
  echo "Hosts reachable on this machine's tailnet — these are the SSH / deploy targets"
  echo "available by name or 100.x address. Lines marked offline aren't reachable now."
  echo
  printf '%s\n' "$status"
fi
'''

[[fragments]]
id = "containers"
description = "Container runtime"
category = "Local Environment"
cache = "5m"
script_lang = "bash"
command = '''
# Guards live inside `if` (not bare `&&` chains) so a missing runtime can't trip
# errexit and abort the script before the output block.
have_docker=0
if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then have_docker=1; fi
have_podman=0
if command -v podman >/dev/null 2>&1 && podman info >/dev/null 2>&1; then have_podman=1; fi
if [ "$have_docker" = 1 ] || [ "$have_podman" = 1 ]; then
  echo "Containers running on this machine right now (host-wide, not just this repo)."
  echo "These are the local services actually available — check here before assuming a"
  echo "database, cache, or queue is or isn't up. PORTS are host->container; if no rows"
  echo "follow, nothing is running locally."
  echo
  if [ "$have_docker" = 1 ]; then docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null; fi
  if [ "$have_podman" = 1 ]; then podman ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>/dev/null; fi
fi
'''

[[fragments]]
id = "ai-tools"
description = "AI tooling"
category = "Local Environment"
cache = "5m"
script_lang = "bash"
command = '''
out=""
for tool in claude codex gemini opencode cursor-agent aider droid amp q goose; do
  if command -v "$tool" >/dev/null 2>&1; then
    out="$out$(printf '%-15s %s\n' "$tool" "$("$tool" --version 2>/dev/null | head -n1)")
"
  fi
done
if command -v gh >/dev/null 2>&1 && gh extension list 2>/dev/null | grep -qi copilot; then
  out="$out$(printf '%-15s %s\n' "gh copilot" "(gh extension)")
"
fi
if [ -n "$out" ]; then
  echo "Peer AI coding CLIs installed here. Use one of these (a different, comparable-or-"
  echo "stronger model than the one doing the work) for the cross-model review / second-"
  echo "opinion step before implementing — shell out to it rather than skipping the step."
  echo
  printf '%s' "$out"
fi
'''

[[fragments]]
id = "toolchain"
description = "Toolchain detection"
category = "Local Environment"
cache = "5m"
script_lang = "bash"
command = '''
echo "Toolchain installed on this machine right now, resolved at render time."
echo "Source of truth for what's available and which version — don't assume a tool"
echo "exists or guess its version; if a tool you need isn't listed, it isn't installed."
echo
# `go` reports its version via `go version`, not `--version`; everything else
# answers to `--version`. Tools absent from PATH are silently skipped.
tool_version() {
  case "$1" in
    go) go version 2>/dev/null ;;
    *)  "$1" --version 2>/dev/null | head -n1 ;;
  esac
}
for tool in node bun deno pnpm yarn python3 uv ruff rustc cargo go git rg fd gh docker; do
  if command -v "$tool" >/dev/null 2>&1; then
    printf '%-10s %s\n' "$tool" "$(tool_version "$tool")"
  fi
done
'''

# Repo-scoped (not machine): lists the commands THIS project defines so the agent
# uses real entry points instead of inventing them. The trailing `if … fi` keeps
# the script's exit status 0 — rosita DROPS a probe's whole output when the script
# exits non-zero (a final `[ cond ] && cmd` that short-circuits is the classic
# trap). `set +e` is just belt-and-suspenders. Stays stable within a session, so a
# render-time snapshot is safe (unlike git state, which churns mid-conversation).
[[fragments]]
id = "project-scripts"
description = "Runnable project commands"
category = "Project"
cache = "5m"
script_lang = "bash"
command = '''
set +e
out=""
add() { out="${out}$1
"; }

# --- package.json scripts (node / bun / nextjs) ---
if [ -f package.json ]; then
  pm="<pm> run"
  [ -f package-lock.json ] && pm="npm run"
  [ -f yarn.lock ] && pm="yarn"
  [ -f pnpm-lock.yaml ] && pm="pnpm run"
  [ -f bun.lock ] && pm="bun run"
  [ -f bun.lockb ] && pm="bun run"
  scripts=""
  if command -v jq >/dev/null 2>&1; then
    scripts=$(jq -r '.scripts // {} | to_entries[] | "  \(.key) — \(.value | gsub("\\s+";" "))"' package.json 2>/dev/null)
  elif command -v node >/dev/null 2>&1; then
    scripts=$(node -e 'try{const s=(require(process.cwd()+"/package.json").scripts)||{};for(const[k,v]of Object.entries(s))console.log("  "+k+" — "+String(v).replace(/\s+/g," ").trim())}catch(e){}' 2>/dev/null)
  elif command -v bun >/dev/null 2>&1; then
    scripts=$(bun -e 'try{const s=(require(process.cwd()+"/package.json").scripts)||{};for(const[k,v]of Object.entries(s))console.log("  "+k+" — "+String(v).replace(/\s+/g," ").trim())}catch(e){}' 2>/dev/null)
  fi
  if [ -n "$scripts" ]; then
    add "package.json scripts (run with \`$pm <name>\`):"
    add "$scripts"
    add ""
  fi
fi

# --- Makefile targets ---
for mk in Makefile makefile GNUmakefile; do
  if [ -f "$mk" ]; then
    targets=$(grep -E '^[a-zA-Z0-9][a-zA-Z0-9_.-]*:' "$mk" 2>/dev/null | grep -v ':=' | sed -E 's/:.*//' | sort -u | sed 's/^/  /')
    if [ -n "$targets" ]; then
      add "Makefile targets (run with \`make <target>\`):"
      add "$targets"
      add ""
    fi
    break
  fi
done

# --- justfile recipes ---
for jf in justfile Justfile .justfile; do
  if [ -f "$jf" ]; then
    recipes=""
    if command -v just >/dev/null 2>&1; then
      recipes=$(just --list --unsorted 2>/dev/null | sed '1d')
    else
      recipes=$(grep -E '^[a-zA-Z0-9][a-zA-Z0-9_-]*( [^:]*)?:' "$jf" 2>/dev/null | sed -E 's/[ :].*//' | sort -u | sed 's/^/  /')
    fi
    if [ -n "$recipes" ]; then
      add "justfile recipes (run with \`just <recipe>\`):"
      add "$recipes"
      add ""
    fi
    break
  fi
done

# --- Cargo (rust / slint) ---
if [ -f Cargo.toml ]; then
  add "Cargo: \`cargo build | test | run | clippy | fmt\` (standard)."
  for cfg in .cargo/config.toml .cargo/config; do
    if [ -f "$cfg" ]; then
      aliases=$(sed -n '/^\[alias\]/,/^\[/p' "$cfg" 2>/dev/null | grep -E '^[a-zA-Z]')
      if [ -n "$aliases" ]; then
        add "  cargo aliases:"
        add "$(printf '%s\n' "$aliases" | sed 's/^/    /')"
      fi
      break
    fi
  done
  add ""
fi

# --- Go module ---
if [ -f go.mod ]; then
  add "Go module: \`go build ./... | go test ./... | go vet ./... | gofmt\` (standard)."
  add ""
fi

if [ -n "$out" ]; then
  echo "Runnable commands this repo actually defines, detected at render time. Prefer these"
  echo "over inventing build/test/lint/run invocations — they're the project's own entry points."
  echo
  printf '%s' "$out"
fi
'''

[[fragments]]
id = "planning-workflow"
description = "Plan before implementing"
category = "Operating Style"
guidance = '''
For non-trivial work, create a plan before implementation:

1. Explore 2–3 different approaches independently — in parallel if the tool
   supports concurrent sub-agents, sequentially otherwise.
2. Synthesize the candidates into one preferred plan.
3. Run a critic pass that actively looks for flaws — use a separate sub-agent or
   fresh session; self-critique inside the planning context tends to rubber-stamp.
4. Revise based on the critic's findings.
5. Get a cross-model review of the final candidate before implementing (a peer AI
   CLI or a sub-agent on a different, comparable-or-stronger model).

Skip the full workflow for trivial edits, typos, obvious one-file fixes, or work
that's just mechanically applying a known pattern across N touchpoints.

A final plan states: objective, relevant context, approach, assumptions, risks,
validation steps, rollback notes, and the first implementation step.
'''

[[fragments]]
id = "validation"
description = "Build & verify before done"
category = "Engineering Standards"
guidance = '''
For any non-trivial change, build the automated harness as part of the work, and
match it to the change: web UI → Playwright tests for visuals and functionality;
API/logic → unit/integration tests; data/scripts → assertions on output.

If a harness would take significant effort (e.g. complex E2E setup), surface that
and ask for manual validation — don't skip silently.

Before declaring work done, run the build, tests, and linter and report results
honestly. If something failed or was skipped, say so plainly — never claim
success you didn't verify.
'''

